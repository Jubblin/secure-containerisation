name: Container quality & attestation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CONTEXT: builds/hermes-agent
  CONTAINERFILE: builds/hermes-agent/Containerfile

jobs:
  build-scan-attest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # required for keyless (OIDC) attestation signing
      attestations: write
      security-events: write # required to upload SARIF to the Security tab
      actions: read # upload-sarif reads workflow-run context internally

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # ghcr.io repository paths must be lowercase; github.repository preserves
      # the account's actual case (e.g. "Jubblin/repo"), so it can't be used directly.
      - name: Compute lowercase image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PRs build locally only (no push) so scanning still runs on every change
      # without requiring registry credentials for forked-PR contributors.
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.CONTAINERFILE }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Resolve scan target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=${{ env.IMAGE }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ env.IMAGE }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
          fi

      # Pinned by commit, not tag: aquasecurity/trivy-action had 76 of 77 tags
      # force-pushed to credential-stealing malware in March 2026 (GHSA-69fq-xp46-6x23).
      #
      # Two scans of the same image: SARIF is opaque in the job log (it's JSON,
      # not for humans), so a table-format pass runs first purely for log
      # readability; the SARIF pass is the actual blocking gate. Both hit
      # Trivy's local vuln-db cache from the first scan, so the second is fast.
      - name: Scan with Trivy (readable log output)
        uses: aquasecurity/trivy-action@v0.36.0 # v0.35.0
        with:
          image-ref: ${{ steps.target.outputs.ref }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
          format: table
          version: v0.75.0

      # Quality gate: fail the build on known-fixable HIGH/CRITICAL vulnerabilities.
      - name: Scan with Trivy (gate)
        uses: aquasecurity/trivy-action@v0.36.0 # v0.35.0
        with:
          image-ref: ${{ steps.target.outputs.ref }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          version: v0.75.0

      # Best-effort: the Security tab's code-scanning upload needs GitHub
      # Advanced Security on private repos, which isn't enabled by default
      # and isn't something this workflow should silently assume. The actual
      # quality gate is the "Scan with Trivy (gate)" step's exit-code above -
      # this step only adds Security-tab visibility when that feature exists.
      - name: Upload Trivy SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: trivy-results.sarif

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.target.outputs.ref }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom.spdx.json

      # Everything below attests the image's *current, built state* — skipped on
      # PRs because it requires a pushed digest and write access to attestations.
      - name: Attest build provenance (SLSA)
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM
        if: github.event_name != 'pull_request'
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
