name: Build and push container images

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - id: matrix
        run: |
          dirs=$(
            for d in builds/*/; do
              [ -f "${d}Containerfile" ] && basename "$d"
            done | jq -R -s -c 'split("\n") | map(select(length > 0)) | map({dir: .})'
          )
          echo "matrix={\"include\":$dirs}" >> "$GITHUB_OUTPUT"

  # Non-blocking: findings go to Security -> Code scanning, never fail the run.
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Containerfile
          recursive: true
          no-fail: true
          format: sarif
          output-file: hadolint.sarif

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_FILE_PATTERNS: dockerfile:Containerfile
        with:
          scan-type: config
          scan-ref: .
          exit-code: 0
          format: sarif
          output: trivy.sarif

      # Fork PRs get a read-only token, so uploads may fail there.
      - name: Upload hadolint SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: hadolint.sarif
          category: hadolint

      - name: Upload Trivy SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy.sarif
          category: trivy

  build:
    runs-on: ubuntu-latest
    needs: [discover, scan]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}/${{ matrix.dir }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: builds/${{ matrix.dir }}
          file: builds/${{ matrix.dir }}/Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
